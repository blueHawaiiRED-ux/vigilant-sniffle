<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't push</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }
        /* 💡 真っ暗になった後はマウスカーソルも非表示にする */
        body.fullscreen-mode {
            cursor: none;
        }
        h1 { color: #333; }
        #escape-btn {
            position: absolute;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        #clear-text {
            display: none;
            color: #ffffff;
            font-size: 32px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1 id="title">ボタンを押さないでください</h1>
    <button id="escape-btn" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">Don't push</button>
    <div id="clear-text">閉じ込められました。 <br><span style="font-size: 18px;">もう戻れません。</span></div>

    <script>
        const button = document.getElementById('escape-btn');
        const title = document.getElementById('title');
        const clearText = document.getElementById('clear-text');
        let isStopped = false;

        // 1. ボタンがマウスから逃げる処理
        button.addEventListener('mouseover', () => {
            if (isStopped) return; 
            const x = Math.random() * (window.innerWidth - button.offsetWidth);
            const y = Math.random() * (window.innerHeight - button.offsetHeight);
            button.style.transform = 'none';
            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        });

        // 2. タイマー：10秒経ったらボタンを中央に止める
        setTimeout(() => {
            isStopped = true;
            title.innerText = "さあ、押してください...";
            button.style.backgroundColor = "#2ed573"; 
            button.style.top = "50%";
            button.style.left = "50%";
            button.style.transform = "translate(-50%, -50%)";
        }, 10000);

        // 3. ボタンを押した瞬間の処理
        button.addEventListener('click', () => {
            document.body.style.backgroundColor = "#000000";
            document.body.classList.add('fullscreen-mode');
            button.style.display = "none";
            title.style.display = "none";
            clearText.style.display = "block";
        });
    </script>
</body>
</html>
